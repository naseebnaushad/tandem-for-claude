# Tests the core on macOS, Windows and Linux for every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./internal/...
      - name: Test
        run: go test ./internal/...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true # the UI package needs GTK headers on Linux; the scan still reports module issues
