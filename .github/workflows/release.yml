# Builds unsigned packages for macOS, Windows and Linux. On a version tag
# (vX.Y.Z, created only by /promote) they are attached to a draft GitHub
# release; on feature branches they are kept as run artifacts for testing.
# Unsigned on purpose (CR-0.1.0-02 D14); the README explains the first-run step.
name: Release

on:
  push:
    tags: ["v*"]
    # Test builds for feature branches: packages are attached to the run as
    # artifacts; only a version tag creates a GitHub Release.
    branches: ["feature/**"]
    paths-ignore: ["documents/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Test
        run: go test ./internal/...
      - name: Version
        shell: bash
        # A vX.Y.Z tag gives X.Y.Z; a manual run on a branch gives <VERSION file>.<short commit>.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(tr -d '[:space:]' < VERSION).${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: NSIS (Windows installer tool)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          command -v makensis || choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Output folder
        shell: bash
        run: mkdir -p dist
      - name: Package (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          wails3 task darwin:package:universal APP_VERSION="$VERSION"
          mv bin/tango.app "bin/Tango for Claude.app"
          ditto -c -k --keepParent "bin/Tango for Claude.app" "dist/tango-for-claude-$VERSION-macos-universal.zip"

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          wails3 task windows:package INSTALL_SCOPE=user APP_VERSION="$VERSION"
          cp bin/tango.exe "dist/tango-for-claude-$VERSION-windows-x64-portable.exe"
          cp bin/tango-amd64-installer.exe "dist/tango-for-claude-$VERSION-windows-x64-setup.exe"

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          wails3 task linux:create:appimage APP_VERSION="$VERSION"
          cp bin/*.AppImage "dist/tango-for-claude-$VERSION-linux-x86_64.AppImage"
          tar -czf "dist/tango-for-claude-$VERSION-linux-x86_64.tar.gz" -C bin tango

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && sha256sum tango-for-claude-* > SHA256SUMS.txt
          # A version with a hyphen (0.1.0-beta.1) is a pre-release.
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $pre --title "Tango for Claude ${GITHUB_REF_NAME#v}" --notes "Unsigned build. See the README for the first-run step on macOS and Windows." tango-for-claude-* SHA256SUMS.txt
